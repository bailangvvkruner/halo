name: CI

on:
  push:
    branches: [main, trae/solo-agent-JAWhGO]
    paths:
      - "halo-go/**"
  pull_request:
    branches: [main]
    paths:
      - "halo-go/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halo-go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./cmd/server/

      - name: Test
        run: go test -v ./...